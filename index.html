<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INDEX</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body>
<!--Menu-->

    <div id="menu-container"></div>
   

    
    <div class="container">
        <h3 class="alert alert-success mt-4 text-center">หน้าหลัก</h3>
        <div class="alert alert-primary text-center" role="alert">
           Patipan Phodee
        </div>
        <div class="text-end mb-4">
            <a class="btn btn-outline-info" href="https://www.google.com/webhp?hl=en&sa=X&ved=2ahUKEwiFiIrc89iWAxU7cWwGHczfEqAQPHoECAYQBA">Google</a>
        </div>
    </div>

    <div class="container text-center">
        <div class="row">
          <div class="col-sm-4 alert alert-dark">
            <img src="Img1/images2.jpg" width="200px">
            <br><br>
            <h4>เสือโคร่งไซบีเรีย</h4>
          </div>
          <div class="col-sm-4 alert alert-light">
            <img  src="Img1/images3.jpg" width="210px" height="auto">
            <br><br>
            <h4>เสือสาว</h4>
          </div>
          
          <div class="col-sm-4 alert alert-secondary">
           <h4 class="mt-4">Register</h4>

           <form class="text-start ">

            <div class="mb-3">
              <label for="exampleInputEmail1" class="form-label">Fritname</label>
              <input type="text" class="form-control" id="Fritname" required placeholder="Fritname">
            </div>

            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Lastname</label>
                <input type="text" class="form-control" id="Lastname" required required placeholder="Lastname">
            </div>
        
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Telephone</label>
                <input type="tel" class="form-control" id="phone"  required required placeholder="ex. xxx-xxx-xxxx">
            </div>

        <div class="mb-3">
            <label class="form-label">Province</label>
            <select class="form-select " id="Province" required>
                
                <option selected>เลือกจังวัด</option>
                <option value="1">สระแก้ว</option>
                <option value="2">ชลบุรี</option>
                <option value="3">ระยอง</option>
              </select>
        </div>

            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email address</label>
                <input type="email" class="form-control" id="e-mail"  required  required required placeholder="e-mail">
            </div>

            <div class="mb-3">
              <label for="exampleInputPassword1" class="form-label">Password</label>
              <input type="password" class="form-control" id="pw" required required required placeholder="password">
            </div>

            <!-- <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="exampleCheck1">
              <label class="form-check-label" for="exampleCheck1">Check me out</label>
            </div> -->

            <div class="text-center mb-4">  
                <button type="submit" class="btn btn btn-danger">Submit</button>
                <button type="submit" class="btn btn btn-danger">Cancel</button>
            </div>


          
          </form>
          </div>
        </div>
      </div>
    
        

</body>
</html>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/menu.js"></script>

<script>
       // โหลด menu.js
    fetch("menu.html")
        .then(res => res.text())
        .then(data => {
            document.getElementById("menu-container").innerHTML = data;

            // ✅ re-bind toggle หลังจากเมนูถูก inject
            const sidebarToggle = document.body.querySelector('#sidebarToggle');
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', event => {
                    event.preventDefault();
                    document.body.classList.toggle('sb-sidenav-toggled');
                });
            }
        });

</script>
