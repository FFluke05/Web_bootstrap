<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">


</head>

<body style="background-color: #E3F2FD;">

    <!--Menu-->
    <div id="menu-container"></div>

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">

        <div class="col-12 col-md-8 col-lg-5 col-xl-4">

            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4 p-sm-5">

                    <h3 class="text-center text-primary mb-4 fw-bold">Login</h3>

                    <form id="form1" action="product.html">

                        <div class="mb-3">
                            <label for="Username" class="form-label fw-semibold text-secondary">Username</label>
                            <input type="text" class="form-control form-control-lg" id="Username"
                                placeholder="username" required>
                        </div>

                        <div class="mb-4">
                            <label for="Password" class="form-label fw-semibold text-secondary">Password</label>
                            <input type="password" class="form-control form-control-lg" id="Password"
                                placeholder="password" required>
                        </div>

                        <div class="d-grid gap-3 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold">Login</button>
                            <a href="register.html" class="btn btn-outline-secondary btn-lg fw-bold">Register</a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>


</body>

</html>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/menu.js"></script>
